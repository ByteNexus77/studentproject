<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎛️ daw · demo (audio sketch)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      user-select: none;
    }
    body {
      background: #0b0f1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1.5rem;
      margin: 0;
    }
    .daw-card {
      max-width: 1000px;
      width: 100%;
      background: #151e2d;
      border-radius: 3rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 45px -10px #000000cc, inset 0 1px 2px #ffffff0d;
      backdrop-filter: blur(2px);
      border: 1px solid #2a3a4e;
    }
    h1 {
      font-weight: 500;
      font-size: 1.4rem;
      letter-spacing: 1px;
      color: #b9c9e0;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid #2a3a4e;
      padding-bottom: 0.8rem;
    }
    h1 span {
      background: #2a3a4e;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 400;
      color: #8aa1c0;
      letter-spacing: 0.5px;
    }
    .grid-2col {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 1.8rem;
    }
    @media (max-width: 720px) {
      .grid-2col { grid-template-columns: 1fr; gap: 2rem; }
      .daw-card { padding: 1.2rem; }
    }

    /* ----- keyboard ----- */
    .keyboard-section {
      background: #101826;
      border-radius: 2rem;
      padding: 1.2rem 0.6rem 1.2rem 0.6rem;
      box-shadow: inset 0 4px 8px #00000055;
    }
    .keyboard-label {
      display: flex;
      justify-content: space-between;
      color: #6f87aa;
      font-size: 0.7rem;
      padding: 0 0.3rem 0.6rem 0.3rem;
      letter-spacing: 0.5px;
    }
    .piano-keys {
      display: flex;
      justify-content: center;
      gap: 3px;
      flex-wrap: wrap;
      padding: 0 2px;
    }
    .key {
      background: #eef3fc;
      border: 1px solid #1b2638;
      border-radius: 0 0 8px 8px;
      width: 44px;
      height: 130px;
      cursor: pointer;
      box-shadow: 0 8px 0 #0f1624, 0 4px 8px #00000077;
      transition: all 0.04s linear;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      font-size: 0.6rem;
      font-weight: 600;
      color: #1f2a3e;
      text-shadow: 0 1px 0 white;
    }
    .key.black {
      background: #141e2e;
      width: 28px;
      height: 80px;
      margin-left: -12px;
      margin-right: -12px;
      z-index: 2;
      box-shadow: 0 6px 0 #090e16, 0 4px 8px #000000bb;
      border: 1px solid #0f1624;
      color: #b7c9e0;
      text-shadow: 0 1px 0 #00000066;
      padding-bottom: 4px;
    }
    .key:active, .key.active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #0f1624;
    }
    .key.black:active, .key.black.active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #090e16;
    }
    .key-label {
      font-size: 0.5rem;
      opacity: 0.6;
    }

    /* ----- pads (sequencer) ----- */
    .sequencer-section {
      background: #101826;
      border-radius: 2rem;
      padding: 1.2rem 0.8rem 1.2rem 0.8rem;
      box-shadow: inset 0 4px
